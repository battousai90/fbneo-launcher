app-id: io.github.battousai90.FbneoLauncher
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: fbneo-launcher

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus         # GtkApplication registration, portals, "open folder"
  - --device=all                 # joysticks and gamepads
  - --share=network              # DAT / artwork / FBNeo release downloads
  # The launcher spawns the FinalBurn Neo binary the user points it at, and reads
  # ROM libraries from wherever they keep them : including external drives.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/devhelp
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

# org.gnome.Platform 49 already provides GTK 3, libarchive, sqlite3, libcurl and
# zlib. It does not provide the gtkmm C++ bindings, nor pugixml, libzip or
# nlohmann-json, so those are built here : checked with
#   pkg-config --modversion <lib>   inside org.gnome.Sdk//49
modules:

  # ── gtkmm 3 and its binding chain, in dependency order ───────────────────
  - name: libsigc++
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false, -Dvalidation=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/2.12/libsigc++-2.12.1.tar.xz
        sha256: a9dbee323351d109b7aee074a9cb89ca3e7bcf8ad8edef1851f4cf359bd50843

  - name: glibmm
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.7.tar.xz
        sha256: fe02c1e5f5825940d82b56b6ec31a12c06c05c1583cfe62f934d0763e1e542b3

  - name: cairomm
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false, -Dbuild-tests=false]
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.14.5.tar.xz
        sha256: 70136203540c884e89ce1c9edfb6369b9953937f6cd596d97c78c9758a5d48db

  - name: pangomm
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.4.tar.xz
        sha256: b92016661526424de4b9377f1512f59781f41fb16c9c0267d6133ba1cd68db22

  - name: atkmm
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/atkmm/2.28/atkmm-2.28.4.tar.xz
        sha256: 0a142a8128f83c001efb8014ee463e9a766054ef84686af953135e04d28fdab3

  - name: gtkmm
    buildsystem: meson
    config-opts: [-Dbuild-documentation=false, -Dbuild-demos=false, -Dbuild-tests=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/3.24/gtkmm-3.24.9.tar.xz
        sha256: 30d5bfe404571ce566a8e938c8bac17576420eb508f1e257837da63f14ad44ce

  # ── The launcher's own dependencies ──────────────────────────────────────
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts: [-DJSON_BuildTests=OFF]
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz
        sha256: d6c65aca6b1ed68e7a182f4757257b107ae403032760ed6ef121c9d55e81757d

  - name: pugixml
    buildsystem: cmake-ninja
    config-opts: [-DBUILD_SHARED_LIBS=ON, -DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: archive
        url: https://github.com/zeux/pugixml/releases/download/v1.14/pugixml-1.14.tar.gz
        sha256: 2f10e276870c64b1db6809050a75e11a897a8d7456c4be5c6b2e35a11168a015

  - name: libzip
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_EXAMPLES=OFF, -DBUILD_DOC=OFF, -DBUILD_REGRESS=OFF]
    sources:
      - type: archive
        url: https://github.com/nih-at/libzip/releases/download/v1.11.4/libzip-1.11.4.tar.gz
        sha256: 82e9f2f2421f9d7c2466bbc3173cd09595a88ea37db0d559a9d0a2dc60dc722e

  - name: fbneo-launcher
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: dir
        path: ..
        # A dir source is copied wholesale into the build context. Without these,
        # every rebuild copies the native build tree, the builder's own cache and
        # the git history : around 270 MB of things the build never reads, with
        # .flatpak-builder recursing into itself.
        skip:
          - .git
          - .flatpak-builder
          - .fp-build
          - .fp-repo
          - build
          - build-package
          - fp-build
          - fp-repo
          - dist
          - website
          - .cache
          - .vscode
