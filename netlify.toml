# Netlify — the landing page is a static folder, no build step.
# Binaries are NOT served from here: they live on GitHub Releases, so a new
# version needs no deploy and does not eat Netlify bandwidth.
[build]
  publish = "website"
  # Pre-renders one static page per language plus the sitemap, so every language
  # has a real, indexable URL instead of being swapped in by JavaScript.
  command = "node website/build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# llms.txt is Markdown, but must stay inline-readable rather than trigger a
# download, so it is served as plain text like robots.txt.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Short, stable links to the downloads.
[[redirects]]
  from = "/download"
  to = "https://github.com/battousai90/fbneo-launcher/releases/latest"
  status = 302
  force = true

[[redirects]]
  from = "/github"
  to = "https://github.com/battousai90/fbneo-launcher"
  status = 302
  force = true
