name: Release

# Fully automatic: any push to main that touches the app bumps the patch
# version, tags it, and publishes a release : no manual CMakeLists.txt edit,
# no manual tag push. The landing page always points at /releases/latest, so
# it never needs touching either.
#
# To rebuild a specific past release (e.g. after fixing a packaging bug),
# use workflow_dispatch with that tag : it skips the bump entirely.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'assets/**'
      - 'locale/**'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v1.0.1) : leave empty for a normal auto-bump run'
        required: false

permissions:
  contents: write

jobs:
  # Resolves what to release: either the tag given to workflow_dispatch, or a
  # fresh patch bump on top of CMakeLists.txt's current version. Runs first so
  # package/flatpak can both build the exact same, already-tagged commit.
  version:
    # The bump below pushes to main with the default token, which GitHub does
    # NOT re-trigger workflows for : so this guard is a belt-and-braces check,
    # not the actual loop prevention.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the release tag
        id: resolve
        run: |
          # A silent partial failure here (e.g. the push to main rejected while
          # the tag push still goes through) must never pass as success : that
          # is exactly what let CMakeLists.txt's version drift away from the
          # real tags for several releases in a row without anyone noticing.
          set -euo pipefail

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "Rebuilding existing tag ${{ github.event.inputs.tag }}"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Git tags are the real source of truth, not CMakeLists.txt's own
          # copy of the version : if the two ever disagree again for any
          # reason, trust the tag rather than silently reusing one already
          # published.
          LATEST_TAG="$(git tag --list 'v*' | sort -V | tail -1)"
          CUR="${LATEST_TAG#v}"
          FILE_VER="$(sed -n 's/^project(fbneo-launcher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$CUR" ] || CUR="$FILE_VER"
          [ -n "$CUR" ] || { echo "!! cannot determine current version (no tags, no CMakeLists.txt version)" >&2; exit 1; }
          if [ -n "$FILE_VER" ] && [ "$FILE_VER" != "$CUR" ]; then
            echo "!! CMakeLists.txt says $FILE_VER but the latest tag is v$CUR : trusting the tag" >&2
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CUR"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $CUR -> $NEW"

          sed -i -E "s/(project\(fbneo-launcher VERSION )[0-9]+\.[0-9]+\.[0-9]+/\1$NEW/" CMakeLists.txt

          # Le manifeste AppStream, sans quoi le magasin ment. C'est LUI que
          # lisent GNOME Logiciels et Discover, pas le binaire : faute de mise
          # a jour ici, onze versions se sont succede pendant que l'utilisateur
          # voyait toujours 1.0.1, avec un historique arrete au 3 aout.
          #
          # Le resume vient du dernier commit humain, donc du titre de la pull
          # request fusionnee : c'est deja la phrase qui decrit la livraison.
          NOTES="$(git log --perl-regexp --author='^(?!github-actions\[bot\]).*' -1 --format=%s)"
          python3 - "$NEW" "$NOTES" <<'PYEOF'
          import sys, datetime, html
          version, notes = sys.argv[1], sys.argv[2]
          path = "packaging/io.github.battousai90.FbneoLauncher.metainfo.xml"
          s = open(path, encoding="utf-8").read()
          if f'version="{version}"' not in s:
              entry = (f'    <release version="{version}" '
                       f'date="{datetime.date.today().isoformat()}">\n'
                       f'      <description>\n'
                       f'        <p>{html.escape(notes)}</p>\n'
                       f'      </description>\n'
                       f'    </release>\n')
              s = s.replace("  <releases>\n", "  <releases>\n" + entry, 1)
              open(path, "w", encoding="utf-8").write(s)
          PYEOF
          appstreamcli validate --no-net packaging/*.metainfo.xml || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-24.04   # oldest supported glibc → widest compatibility
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config file desktop-file-utils \
            libgtkmm-3.0-dev libpugixml-dev nlohmann-json3-dev \
            libcurl4-openssl-dev libzip-dev libarchive-dev \
            zlib1g-dev libsqlite3-dev \
            libfuse2 patchelf librsvg2-dev

      - name: Build .deb, .tar.gz and AppImage
        run: ./scripts/package.sh deb tgz appimage

      - name: Verify the AppImage starts
        run: |
          APP=$(ls dist/*.AppImage)
          chmod +x "$APP"
          "$APP" --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/fbneo-launcher/assets/logo.svg
          test -f squashfs-root/usr/share/fbneo-launcher/locale/fr.json
          echo "AppImage payload looks right"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS

  # Flatpak needs its own runtime image, so it runs separately and is allowed to
  # fail without holding back the other packages.
  flatpak:
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      # Must match runtime-version in the manifest. bilelmoussaoui/flatpak-github-actions
      # (Docker Hub) is unmaintained and stuck at gnome-47 : the project moved to
      # ghcr.io/flathub-infra, which actually publishes current GNOME runtime images.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fbneo-launcher.flatpak
          manifest-path: packaging/io.github.battousai90.FbneoLauncher.yml
          cache-key: flatpak-builder-${{ needs.version.outputs.tag }}

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: fbneo-launcher.flatpak
