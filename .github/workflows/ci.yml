name: Build

# Only run when something that actually affects the binary changes. An allow-list
# is used rather than paths-ignore so that a new top-level folder (docs, artwork,
# whatever) does not silently start triggering C++ builds again.
#
# The same filter has to be on both triggers: work lands through pull requests, so
# a filter on `push` alone would never apply.
on:
  push:
    branches: [main, Dev]
    paths: &code
      - 'src/**'
      - 'CMakeLists.txt'
      - 'assets/**'
      - 'locale/**'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths: *code
  workflow_dispatch:

# Read-only token. This workflow runs on pull requests, including from forks, so
# it must never be able to write to the repository or publish anything.
permissions:
  contents: read

jobs:
  build:
    # 24.04 is the stable baseline. 26.04 is public preview since June 2026
    # (runner-images #14226); included for an early warning, but drop it first
    # if it turns out flaky rather than touching the stable leg.
    #
    # No ubuntu-22.04 leg: it exists only to run an ancient libzip that nobody
    # should still be building against. The regression it used to catch (libzip
    # lacking zip_source_zip_file) is instead forced directly below, on current
    # Ubuntu, by overriding the CMake symbol probe : so the old code path still
    # gets compiled and exercised without needing a five-year-old library.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtkmm-3.0-dev libpugixml-dev nlohmann-json3-dev \
            libcurl4-openssl-dev libzip-dev libarchive-dev \
            zlib1g-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Report the detected libzip API
        run: |
          echo "libzip $(pkg-config --modversion libzip)"
          grep HAVE_ZIP_SOURCE_ZIP_FILE build/CMakeCache.txt || true

      - name: Build
        run: cmake --build build -j$(nproc)

      # Regression canary for the libzip API split (zip_source_zip_file vs. the
      # older zip_source_zip), without needing an actually old libzip anywhere.
      # check_symbol_exists() skips its own probe when the variable is already
      # defined, so this forces RomInbox.cpp down the pre-1.10 code path on
      # today's Ubuntu : verified locally: it compiles, with the expected
      # deprecation warning proving the old branch was really taken.
      - name: Build against the pre-1.10 libzip API (regression canary)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -S . -B build-oldzip -DCMAKE_BUILD_TYPE=Release -DHAVE_ZIP_SOURCE_ZIP_FILE=OFF
          grep -q 'HAVE_ZIP_SOURCE_ZIP_FILE:UNINITIALIZED=OFF' build-oldzip/CMakeCache.txt
          cmake --build build-oldzip --target fbneo-launcher -j$(nproc)

      - name: Check the install tree resolves
        run: |
          cmake --install build --prefix /tmp/prefix
          test -x /tmp/prefix/bin/fbneo-launcher
          test -f /tmp/prefix/share/fbneo-launcher/assets/logo.svg
          test -f /tmp/prefix/share/fbneo-launcher/locale/fr.json
          test -f /tmp/prefix/share/applications/io.github.battousai90.FbneoLauncher.desktop

      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate /tmp/prefix/share/applications/*.desktop
          appstreamcli validate --no-net /tmp/prefix/share/metainfo/*.metainfo.xml || true

      - name: Translation catalogues stay in sync
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          langs = ["fr", "de", "es", "pt", "ja", "zh", "th"]
          cats = {l: set(json.loads(pathlib.Path(f"locale/{l}.json").read_text(encoding="utf-8"))) for l in langs}
          ref = cats[langs[0]]
          bad = False
          for l, keys in cats.items():
              missing, extra = ref - keys, keys - ref
              if missing or extra:
                  bad = True
                  print(f"{l}: {len(missing)} missing, {len(extra)} extra")
                  for k in sorted(missing)[:10]: print(f"   missing: {k!r}")
                  for k in sorted(extra)[:10]:   print(f"   extra:   {k!r}")
          print(f"{len(ref)} keys per catalogue")
          sys.exit(1 if bad else 0)
          PY
