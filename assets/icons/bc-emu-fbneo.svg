<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- La marque FinalBurn Neo, telle qu'elle se presente : FB rouge au-dessus
       de NEO jaune. Tracee ici plutot que telechargee : la page des emulateurs
       doit s'afficher hors ligne, et une vignette manquante ferait un trou. -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="24" y="23" font-size="20" fill="#e5484d">FB</text>
    <text x="24" y="41" font-size="17" fill="#f5c518">NEO</text>
  </g>
</svg>
